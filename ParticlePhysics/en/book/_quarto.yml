project:
  type: book
  output-dir: ../../../_site/ParticlePhysics/en/book

book:
  title: "Particle Physics"
  author: "Dmitry V. Naumov"
  site-url: "https://neutrinohit.github.io/particlephysics/ParticlePhysics/en/book/"
  repo-url: "https://github.com/NeutrinoHit/particlephysics"
  repo-subdir: "ParticlePhysics/en/book"
  search: true
  reader-mode: true
  page-footer:
    left: "© Dmitry V. Naumov"
    right: "NeutrinoHit · Particle Physics"
  chapters:
    - index.qmd

lang: en

filters:
  - assets/filters/neutrinohit-book.lua

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    grid:
      sidebar-width: 270px
      body-width: 1050px
      margin-width: 230px
      gutter-width: 1rem
    css:
      - assets/styles/neutrinohit-book.css
    theme: cosmo
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-responsive: true
    include-after-body: ../../../analytics/cloudflare-web-analytics.html
  pdf:
    documentclass: scrbook
    classoption:
      - open=any
    papersize: a4
    fontsize: 11pt
    geometry:
      - top=18mm
      - bottom=20mm
      - inner=20mm
      - outer=50mm
      - marginparwidth=36mm
      - marginparsep=6mm
      - headheight=6mm
      - headsep=5mm
      - footskip=9mm
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    pdf-engine: lualatex
    include-in-header:
      - ../../../shared/latex/neutrinohit-book.tex
      - ../../../shared/latex/en-lang.tex
