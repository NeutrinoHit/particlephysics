project:
  type: website
  output-dir: _site
  resources:
    - "/assets/**"
    - "shared/reveal/**"
    - "shared/styles/**"
    - "analytics/**"
    - "/IntroParticlePhysicsBaikal/assets/**"
    - "IntroParticlePhysicsBaikal/requirements.txt"
    - "IntroParticlePhysicsBaikal/environment.yml"
    - "IntroParticlePhysicsBaikal/references.bib"
  render:
    - "*.qmd"
    - "IntroParticlePhysicsBaikal/index.qmd"
    - "IntroParticlePhysicsBaikal/slides/*.qmd"
    - "IntroParticlePhysicsBaikal/handouts/*.qmd"
    - "IntroParticlePhysicsBaikal/appendices/*.qmd"
    - "ParticlePhysics/index.qmd"
    - "ParticlePhysics/ru/slides/*.qmd"
    - "ParticlePhysics/en/slides/*.qmd"
    # The books are separate Quarto book projects rendered into _site by
    # `make site`; "*.qmd" above matches files at every level.
    - "!ParticlePhysics/ru/book/"
    - "!ParticlePhysics/en/book/"

lang: ru-RU

website:
  title: "Физика элементарных частиц"
  site-url: "https://neutrinohit.github.io/particlephysics/"
  repo-url: "https://github.com/NeutrinoHit/particlephysics"
  navbar:
    left:
      - href: https://neutrinohit.github.io/
        text: NeutrinoHit
      - href: https://neutrinohit.github.io/ru/education.html#particles
        text: Карта курса
      - href: index.qmd
        text: Раздел
      - href: IntroParticlePhysicsBaikal/index.qmd
        text: Мини-курс
      - href: ParticlePhysics/index.qmd
        text: Введение в физику элементарных частиц
  page-footer:
    left: "© NeutrinoHit"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css:
      - https://neutrinohit.github.io/assets/site/neutrinohit-tokens.css
      - https://neutrinohit.github.io/assets/site/neutrinohit-base.css
      - https://neutrinohit.github.io/assets/site/neutrinohit-components.css
      - https://neutrinohit.github.io/assets/site/neutrinohit-projects.css
      - styles.css
    toc: false
    page-layout: full
    include-after-body: analytics/cloudflare-web-analytics.html
